name: Review pull request

# Runs on every pull request. It builds the app, runs lint, and writes a review report.
# It never merges or pushes. A person must read the report and approve the pull request.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code (with the base branch for comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the base version
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"

      - name: Scan the change for risky patterns
        id: scan
        run: |
          set +e
          python3 tools/scan_patch.py ../base . report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Build and lint
        run: |
          cd JarvisAI
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew lint assembleDebug --no-daemon; else echo 'No gradle wrapper in repo yet; add it before enabling this check.'; exit 1; fi

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: report.md

      - name: Comment the report on the pull request
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: report.md

      - name: Fail when a high-risk finding needs review
        if: steps.scan.outputs.code == '2'
        run: |
          echo "High-risk finding. A reviewer must check the report before this can be merged."
          exit 1
