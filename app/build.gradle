plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.siddharthvenu.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.siddharthvenu.jarvis"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Old transitive copies of kotlin-stdlib-jdk7/jdk8 clash with kotlin-stdlib (they are part of it now).
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
